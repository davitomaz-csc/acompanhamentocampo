<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
/* ===================== Estúdio de Rotas Campo 2.0 — acompanhamento de linha e vistoria de pontos no celular =====================
 Abre o “pacote de campo” gerado no Estúdio de Rotas (computador): rotas, pontos, horários e quantidade de passageiros — sem nomes.
 Acompanhamento (2.0): Modo A (no ônibus com o motorista: cabeçalho + checklist do “Controle de acompanhamento de linha”) ou
 Modo B (acompanhamento individual de carro ou ônibus). GPS contínuo, paradas com raio de tolerância, embarques/desembarques,
 fechamento com métricas e arquivo para importar no computador. Vistoria de pontos: checklist, fotos e posição pelo GPS.
 Tudo fica guardado no próprio celular até ser enviado. */
const APP='Estúdio de Rotas Campo 2.4.1 · by Davi';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=(p='i')=>p+Date.now().toString(36).slice(-6)+Math.random().toString(36).slice(2,6);
const dm=(a,b)=>{const t=Math.PI/180,x=(b.lat-a.lat)*t,y=(b.lon-a.lon)*t,h=Math.sin(x/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(y/2)**2;return 2*6371008.8*Math.asin(Math.min(1,Math.sqrt(h)));};
const fmtM=m=>m>=1000?(m/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' km':Math.round(m)+' m';
function dec(s){if(!s)return[];let i=0,la=0,lo=0;const o=[];while(i<s.length){for(let k=0;k<2;k++){let sh=0,r=0,b;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5;}while(b>=32);const d=r&1?~(r>>1):r>>1;if(k)lo+=d;else la+=d;}o.push([la/1e6,lo/1e6]);}return o;}
function toast(m,k='',ms=4500){const el=$('toast');const d=document.createElement('div');d.className=k;d.textContent=m;el.prepend(d);while(el.children.length>3)el.lastChild.remove();setTimeout(()=>d.remove(),ms);}
/* ---------- armazenamento no celular (IndexedDB → localStorage → memória) ---------- */
const DB={db:null,mem:new Map(),mode:'mem',
 open(){return new Promise(res=>{try{const rq=indexedDB.open('rota-studio-campo',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');rq.onsuccess=()=>{this.db=rq.result;this.mode='idb';res(true);};rq.onerror=()=>res(false);rq.onblocked=()=>res(false);}catch{res(false);}}).then(ok=>{if(!ok){try{localStorage.setItem('rsc:t','1');localStorage.removeItem('rsc:t');this.mode='ls';}catch{this.mode='mem';}}return this.mode;});},
 get(k){if(this.mode==='idb')return new Promise(res=>{try{const q=this.db.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null);}catch{res(null);}});if(this.mode==='ls'){try{return Promise.resolve(JSON.parse(localStorage.getItem('rsc:'+k)||'null'));}catch{return Promise.resolve(null);}}return Promise.resolve(this.mem.get(k)??null);},
 set(k,v){if(this.mode==='idb')return new Promise((res,rej)=>{try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);}catch(e){rej(e);}});if(this.mode==='ls'){try{localStorage.setItem('rsc:'+k,JSON.stringify(v));return Promise.resolve(true);}catch(e){return Promise.reject(e);}}this.mem.set(k,v);return Promise.resolve(true);},
 del(k){if(this.mode==='idb')return new Promise(res=>{try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch{res(false);}});if(this.mode==='ls'){try{localStorage.removeItem('rsc:'+k);}catch{}}this.mem.delete(k);return Promise.resolve(true);}};
/* ---------- estado ---------- */

let RES={};           // resultados: chave do ponto → vistoria (fotos ficam à parte: 'ph:<id>')

function gpsToggle(force){const want=force??!GPS_ON;if(!want){if(GPSW!=null)navigator.geolocation.clearWatch(GPSW);GPSW=null;GPS_ON=false;MELAY&&MELAY.clearLayers();$('btnGps').classList.remove('on');return;}

 GPSW=navigator.geolocation.watchPosition(p=>{const prev=GPS;const c=p.coords;GPS={lat:c.latitude,lon:c.longitude,acc:c.accuracy,at:Date.now()};
  /* velocidade e rumo: do GPS; sem eles, calculados entre as duas últimas leituras */
  const dd=prev?dm(prev,GPS):0,dt=prev?(GPS.at-prev.at)/1000:0;GPS.kmh=c.speed!=null&&c.speed>=0?c.speed*3.6:(dt>0&&dd>2?dd/dt*3.6:0);GPS.hd=c.heading!=null&&!isNaN(c.heading)?c.heading:(prev&&dd>5?brg(prev,GPS):prev?.hd||0);

function gpsInfoHtml(){const t=VIEW.v==='point'?curStop():null;if(!GPS)return GPS_ON?'<span class="mut">Procurando o GPS…</span>':'';const age=(Date.now()-GPS.at)/1000;return `📍 Você está ${t?'a <b>'+fmtM(dm(GPS,t))+'</b> do ponto · ':''}precisão ±${Math.round(GPS.acc)} m${age>30?' · leitura de '+Math.round(age)+' s atrás':''}`;}
const brg=(a,b)=>{const t=Math.PI/180,y=Math.sin((b.lon-a.lon)*t)*Math.cos(b.lat*t),x=Math.cos(a.lat*t)*Math.sin(b.lat*t)-Math.sin(a.lat*t)*Math.cos(b.lat*t)*Math.cos((b.lon-a.lon)*t);return(Math.atan2(y,x)/t+360)%360;};
/* distância (m) de um ponto até o traçado planejado (projeção plana local; suficiente na escala da cidade) */
function distLine(p,g){if(!g||g.length<2)return Infinity;const k=Math.cos(p.lat*Math.PI/180)*111320,K=110540;let best=Infinity;for(let i=1;i<g.length;i++){const ax=(g[i-1][1]-p.lon)*k,ay=(g[i-1][0]-p.lat)*K,bx=(g[i][1]-p.lon)*k,by=(g[i][0]-p.lat)*K,dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;let t=L2?-(ax*dx+ay*dy)/L2:0;t=Math.max(0,Math.min(1,t));const d=Math.hypot(ax+t*dx,ay+t*dy);if(d<best)best=d;}return best;}

  :VIEW.ask===2?`<div class="note bad" style="font-size:15px"><b>Tem certeza?</b> Sem enviar, este acompanhamento será <b>excluído</b> deste celular e não poderá ser recuperado.<div class="btns" style="margin-bottom:0"><button class="ok" onclick="acAsk('sim')">☁ Enviar</button><button class="bad" onclick="acAsk('excluir')">Sim, excluir</button></div></div>`:'';
 const T=m.tec,rows=car?tecRows(a,r?.stops||a.prog||[]):[];
 const kp=car?`<div><b>${durTxt(m.dur)}</b><span>tempo total do percurso (desde o Ponto 1)</span></div><div class="${m.miss?'bad':'ok'}"><b>${m.att} de ${m.nProg}</b><span>pontos verificados</span></div><div><b>${(m.km||0).toLocaleString('pt-BR')} km</b><span>quilometragem aferida (GPS)</span></div><div class="${m.off?'bad':''}"><b>${m.off}</b><span>saída(s) do traçado planejado</span></div><div class="${T.fisN?'bad':'ok'}"><b>${T.fisN}</b><span>ponto(s) com problema físico</span></div><div><b>${T.refUp}</b><span>referência(s) a atualizar</span></div>`
  :`<div><b>${m.emb}</b><span>embarques</span></div><div><b>${m.des}</b><span>desembarques</span></div><div><b>${m.peak}</b><span>pico de lotação a bordo</span></div><div><b>${durTxt(m.dur)}</b><span>tempo total de viagem</span></div>
 <div class="ok"><b>${m.inT}</b><span>paradas no ponto correto</span></div><div class="${m.out?'bad':''}"><b>${m.out}</b><span>paradas fora do ponto (desvio)</span></div>
 <div class="${m.miss?'bad':''}"><b>${m.att} de ${m.nProg}</b><span>pontos programados atendidos</span></div><div class="${m.off?'bad':''}"><b>${m.off}</b><span>saída(s) do traçado planejado</span></div>
 <div><b>${m.tmN?pct(m.onTime,m.tmN):'—'}</b><span>pontualidade (±5 min)${m.avg!=null?' · média '+(m.avg>0?'+':'')+Math.round(m.avg)+' min':''}</span></div>
 <div class="${a.ckSkip?'':m.ckBad.length?'bad':'ok'}"><b>${a.mode==='B'?'—':a.ckSkip?'dispensado':m.ckOkN+' de '+m.ckN}</b><span>checklist conforme</span></div>`;
 const tec=car?`${T.fisN?`<div class="note bad"><b>Problemas físicos:</b> ${FIS.filter(([k])=>T.fis[k]).map(([k,l])=>esc(l.replace(/^\S+\s/,''))+' ('+T.fis[k]+')').join(' · ')}</div>`:''}
 <h3>Cronograma relativo (tempo entre pontos)</h3>${rows.map(x=>`<div class="card" style="cursor:default"><span class="num" style="background:${x.s?'#16A34A':x.miss?'var(--bad)':'#94a3b8'}">${esc(x.n)}</span><div class="grow" style="min-width:0"><b>${esc(x.name)}</b><small>${x.s?`T+${fmtT(x.tRel)} · trecho ${fmtT(x.dt)}${x.dtP!=null?' (previsto '+fmtT(x.dtP)+')':''} · ${esc(fisTxt(x.s))}${x.s.refUp?.txt?' · nova referência: “'+esc(x.s.refUp.txt)+'”':''}`:x.miss?'Sem check — '+esc(x.miss.why):'Sem check'}</small></div></div>`).join('')}
 <h3>Parecer técnico da rota</h3><textarea rows="3" placeholder="ex.: rota viável; ajustar o ponto 7 (obstruído por caçamba) e rever a manobra na R. X" oninput="acParecer(${VIEW.h},this.value)" onchange="saveAll();render()">${esc(a.parecer||'')}</textarea><small class="hint">Vai no relatório para o cliente. Se já tinha enviado, envie de novo depois de escrever.</small>`
  :`${a.ckSkip?`<div class="note warn"><b>Checklist dispensado:</b> ${esc(a.ckSkip.why)}</div>`:m.ckBad.length?`<div class="note bad"><b>Não conforme:</b> ${m.ckBad.map(esc).join(' · ')}</div>`:''}`;
 $('sheet').innerHTML=`<div class="grab" onclick="sheetSize()"></div>${ask}<h2>${esc(a.head.linha)} · ${esc(a.head.sentido)}</h2><p class="small mut" style="margin-top:-4px">${esc(fdt(a.head.data))} · ${esc(a.head.hIni)}–${esc(a.head.hFim)} · ${a.mode==='A'?'Modo A (com o motorista)':car?'Vistoria técnica de carro':'Modo B (individual, '+esc(a.head.veic)+')'} · ${esc(a.head.acomp)} (mat. ${esc(a.head.matAcomp)})</p>
 <div class="kpis">${kp}</div>${tec}
 ${Object.keys(m.motivos).length?`<h3>Motivos das paradas fora do ponto</h3>${Object.entries(m.motivos).map(([k,n])=>`<div class="small">• ${esc(k)} <b>(${n})</b></div>`).join('')}`:''}
 <h3>${car?'Registros':'Paradas'}</h3>${a.stops.map((s,i)=>`<div class="card" style="cursor:default"><span class="num" style="background:${s.inTol?'var(--ok)':s.semGps?'#64748b':'var(--bad)'}">${i+1}</span><div class="grow" style="min-width:0"><b>${s.inTol?'Nº '+esc(s.match.n)+' · '+esc(s.match.name):s.semGps?'Sem GPS':'Fora do ponto'+(s.match?' (a '+fmtM(s.match.d)+' do Nº '+esc(s.match.n)+')':'')}</b><small>${car?esc(fisTxt(s))+(s.refUp?.txt?' · nova referência':''):`⬆ ${s.emb} · ⬇ ${s.des} · a bordo ${s.bordo}`}${s.motivo?' · '+esc(s.motivo==='Outros'?s.motivoTxt:s.motivo):''}${s.obs?' · '+esc(s.obs):''}${s.photo?' · 📷':''}</small></div><div class="tm">${car&&s.tRel!=null?'T+'+fmtT(s.tRel):esc(s.real)}${s.prog?'<br><small>prog. '+esc(s.prog)+'</small>':''}</div></div>`).join('')||'<p class="small mut">Nenhuma parada registrada.</p>'}
 <div class="btns one" style="margin-top:12px">${CONN?`<button class="ok" onclick="acCloud(${VIEW.h})" ${a.sent?'disabled':''}>${a.sent?'☁ Entregue ao Estúdio de Rotas':a.queued?'☁ Na fila — tentar enviar de novo':'☁ Enviar direto ao Estúdio de Rotas'}</button>`:''}${CONN?'<details class="help"><summary>Outras formas de enviar (arquivo)</summary><div class="btns one" style="margin:6px 0 0">':''}<button class="p" onclick="acExport(${VIEW.h},true)">📤 Exportar / Compartilhar acompanhamento</button><button onclick="acExport(${VIEW.h},false)">⬇ Salvar arquivo no celular</button>${CONN?'</div><p class="small mut" style="margin:6px 0 0">Só se a internet do celular não funcionar. Ao salvar no Google Drive, escolha a pasta <b>Projeto Rotas › campo › entrada</b> — não deixe na raiz do Drive.</p></details>':''}<button onclick="acWhats(${VIEW.h})">💬 Enviar resumo pelo WhatsApp</button><button onclick="go({v:'home'})">Concluir</button><button class="bad" onclick="acDel(${VIEW.h})">🗑 Excluir este acompanhamento</button></div>
 <p class="small mut">No computador, no Estúdio de Rotas: <b>Importar</b> e escolha o arquivo — o acompanhamento entra com 1 clique.${a.sent?' Enviado em '+new Date(a.sent).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})+'.':''}</p>`;}
function acParecer(i,v){const a=HIST[i];if(!a)return;a.parecer=v;if(a.sent){a.sent='';a.queued=false;}}
/* resumo legível (WhatsApp/e-mail) */
function acText(a){const m=acMetrics(a);if(acCar(a)){const T=m.tec;return[`*Vistoria técnica de linha (carro)* — ${a.head.linha} ${a.head.sentido}`,`${fdt(a.head.data)} · ${a.head.hIni}–${a.head.hFim} · percurso ${durTxt(m.dur)} · ${String(m.km).replace('.',',')} km`,`Auditor: ${a.head.acomp} (mat. ${a.head.matAcomp})`,'',`Pontos verificados: ${m.att} de ${m.nProg}${T.miss?' · '+T.miss+' sem check (justificados)':''}`,`Pontos com problema físico: ${T.fisN}`,...FIS.filter(([k])=>T.fis[k]).map(([k,l])=>`• ${l.replace(/^\S+\s/,'')}: ${T.fis[k]}`),T.refUp?`Referências a atualizar: ${T.refUp}`:'',m.off?`Saídas do traçado planejado: ${m.off}`:'',a.parecer?'\nParecer: '+a.parecer:''].filter(x=>x!=='').join('\n');}
 return [`*Acompanhamento de linha* — ${a.head.linha} ${a.head.sentido}`,`${fdt(a.head.data)} · ${a.head.hIni}–${a.head.hFim} (${durTxt(m.dur)})`,a.mode==='A'?`Modo A · carro ${a.head.carro} · motorista ${a.head.motorista} (mat. ${a.head.matMot})`:`Modo B · individual (${a.head.veic})`,`Acompanhante: ${a.head.acomp} (mat. ${a.head.matAcomp})`,'',
 `Paradas: ${m.nStops} — ${m.inT} no ponto, ${m.out} fora do ponto${m.semGps?', '+m.semGps+' sem GPS':''}`,`Pontos programados atendidos: ${m.att} de ${m.nProg}`,`Embarques ${m.emb} · Desembarques ${m.des} · Pico a bordo ${m.peak}`,m.tmN?`Pontualidade: ${m.onTime} de ${m.tmN} no horário (±5 min)${m.avg!=null?' · média '+(m.avg>0?'+':'')+Math.round(m.avg)+' min':''}`:'',m.off?`Saídas do traçado planejado: ${m.off}`:'',
 a.mode==='A'?(a.ckSkip?`Checklist dispensado: ${a.ckSkip.why}`:`Checklist: ${m.ckOkN} de ${m.ckN} conforme${m.ckBad.length?' — não conforme: '+m.ckBad.join(', '):''}`):'',...Object.entries(m.motivos).map(([k,n])=>`• Fora do ponto: ${k} (${n})`)].filter(x=>x!=='').join('\n');}
async function acData(a){const stops=[];for(const s of a.stops)stops.push({...s,photo:s.photo?(await DB.get('ph:'+s.photo))||'':''});const r=routeOf(pkgOf(a.route.pk),a.route.id);
 const data={kind:'rota-studio-acomp',v:1,app:APP,made:new Date().toISOString(),acomp:{...a,stops,nProg:r?.stops.length||a.nProg||0,prog:(r?.stops||[]).map((s,k)=>({i:k,n:s.n||k+1,name:s.name,ref:s.ref||'',pid:s.pid||'',lat:s.lat,lon:s.lon,t:s.t||''})),line:r?.line||'',metrics:acMetrics(a),text:acText(a)}};
 const name='Acompanhamento_'+String(a.head.linha).replace(/[^\wÀ-ú]+/g,'_')+'_'+a.head.sentido+'_'+a.head.data+'_'+a.head.hIni.replace(':','h')+'.json';
 return{data,name};}
async function acExport(i,share){const a=HIST[i];if(!a)return;const{data,name}=await acData(a);
 if(!await shareFile(data,name,share,'Acompanhamento '+a.head.linha+' '+a.head.sentido,acText(a)))return;a.sent=new Date().toISOString();await saveAll();toast('Acompanhamento pronto para o computador.','ok');render();}
function acWhats(i){const a=HIST[i];if(a)window.open('https://wa.me/?text='+encodeURIComponent(acText(a)),'_blank');}
async function boot(){setHH();if(window.ResizeObserver)new ResizeObserver(setHH).observe(document.querySelector('header'));addEventListener('resize',setHH);setInterval(()=>{if(VIEW.v==='acRun'&&AC&&AC.status==='run')hud();},1000);await DB.open();PKGS=(await DB.get('pkgs'))||[];RES=(await DB.get('res'))||{};ME=(await DB.get('me'))||'';MAT=(await DB.get('mat'))||'';AC=(await DB.get('ac'))||null;HIST=(await DB.get('hist'))||[];CONN=(await DB.get('conn'))||null;FILA=(await DB.get('fila'))||[];if(AC&&AC.status==='run'&&!('t0' in AC))AC.t0=AC.startAt;/* viagem iniciada na 2.3 */initMap();
 $('btnBack').onclick=()=>{FORM=null;const v=VIEW.v;if(v==='form')go({...VIEW,v:'point'});else if(v==='point'&&VIEW.r!=='§novos')go({v:'route',pk:VIEW.pk,r:VIEW.r});else if(v==='route'||v==='send')go({v:'vist'});else if(v==='acStop'){STOP=null;go({v:'acRun'});}else if(v==='acHead')go({v:'acNew'});else go({v:'home'});};
 $('btnLayer').onclick=toggleTiles;$('btnGps').onclick=()=>gpsToggle();$('file').onchange=e=>{openFile(e.target.files[0]);e.target.value='';};
 window.addEventListener('beforeunload',e=>{if((pendingExport()||AC)&&DB.mode==='mem'){e.preventDefault();e.returnValue='';}});
 if(AC&&AC.status==='run'){go({v:'acRun'});toast('Acompanhamento em andamento retomado.','ok');}else render();if(CONN)campoSync(false);}
/* ---------- conexão com o Estúdio de Rotas (Apps Script do link): a base chega sozinha e os resultados vão direto ---------- */
const connUrl=q=>CONN.url+(CONN.url.includes('?')?'&':'?')+q;
function campoConnect(){const c=prompt('Cole o código de conexão (computador: Estúdio de Rotas → Acompanhamentos → Sincronização com o celular → Copiar).\nDeixe em branco para desconectar.','');if(c===null)return;
 if(!c.trim()){CONN=null;saveAll();render();toast('Celular desconectado do Estúdio de Rotas.','ok');return;}
 let t=c.trim();if(/^RSC2-/.test(t)){try{const b=t.slice(5).replace(/\s+/g,'');t='RSC1|'+atob(b+'='.repeat((4-b.length%4)%4));}catch{t='';}}
 const m=/^RSC1\|(https:\/\/script\.google(?:usercontent)?\.com\/[^|\s]+)\|([0-9a-f]{16,64})$/i.exec(t);if(!m){toast('Código inválido: copie de novo no Estúdio de Rotas (Acompanhamentos → 📋 Copiar) e cole aqui, sem abrir como link.','bad',8000);return;}
 CONN={url:m[1],key:m[2],at:''};saveAll();campoSync(true);}
async function campoSync(manual){if(!CONN)return;if(!navigator.onLine){if(manual)toast('Sem internet agora: a base fica como está e os envios esperam na fila.','warn');return;}
 try{const r=await fetch(connUrl('campo=pacote&t='+encodeURIComponent(CONN.key)));const d=await r.json();if(d.ok===false)throw new Error(d.erro||'erro do Estúdio de Rotas');if(d.kind!=='rota-studio-campo'||!Array.isArray(d.routes))throw new Error('resposta inesperada');
  await loadPkg({...d,auto:true});CONN.at=new Date().toISOString();await saveAll();if(manual)toast('Base atualizada: '+d.routes.length+' viagem(ns) vigente(s).','ok');if(['home','vist'].includes(VIEW.v))render();}
 catch(e){if(manual)toast('Não consegui buscar a base: '+e.message,'bad',8000);}await flush();}
/* 2.4.1: o mesmo acompanhamento enviado de novo substitui o que estava na fila (evita arquivo “(1)” no computador) */
async function enviar(nome,dados,ref){FILA=FILA.filter(f=>f.nome!==nome&&!(ref?.ac&&f.ref?.ac===ref.ac));FILA.push({nome,dados,ref:ref||null,at:new Date().toISOString()});await saveAll();return flush();}
let FLUSHING=false;
async function flush(){if(!CONN||!FILA.length||FLUSHING||!navigator.onLine)return !FILA.length;FLUSHING=true;let ok=0;
 try{while(FILA.length){const it=FILA[0];const r=await fetch(CONN.url,{method:'POST',body:JSON.stringify({t:CONN.key,nome:it.nome,dados:it.dados})});const d=await r.json().catch(()=>({ok:false,erro:'resposta inválida'}));if(!d.ok)throw new Error(d.erro||'falhou');
  FILA.shift();ok++;const now=new Date().toISOString();if(it.ref?.ac){const h=HIST.find(x=>x.id===it.ref.ac);if(h)h.sent=now;}for(const k of it.ref?.vist||[])if(RES[k])RES[k].sent=now;await saveAll();}}
 catch(e){toast('Envio ao Estúdio de Rotas pendente ('+e.message+'). Tento de novo quando houver internet.','warn',7000);}finally{FLUSHING=false;}
 if(ok){toast(ok+' envio(s) entregue(s) ao Estúdio de Rotas.','ok');if(['home','acEnd','vist'].includes(VIEW.v))render();}return !FILA.length;}
window.addEventListener('online',()=>flush());
document.addEventListener('DOMContentLoaded',boot);
</script>
</body></html>
