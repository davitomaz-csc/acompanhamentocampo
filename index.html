<style>

.mk.okc{background:#16A34A;width:30px;height:30px;font-size:16px;box-shadow:0 0 0 3px #16a34a59,0 1px 4px #0007}.mk.alrt{background:#F59E0B;color:#111;box-shadow:0 0 0 3px #f59e0b59,0 1px 4px #0007}.mk.offp{width:18px;height:18px;background:#DC2626;box-shadow:0 0 0 4px #dc262640,0 1px 4px #0007}
#sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.dist{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 14px;margin:4px 0 8px;color:#fff}.dist.ok{background:#16A34A}.dist.bad{background:#DC2626}.dist b{font-size:clamp(26px,8vw,34px);font-weight:800;line-height:1;white-space:nowrap}.dist span{font-size:13.5px;line-height:1.3}

const dm=(a,b)=>{const t=Math.PI/180,x=(b.lat-a.lat)*t,y=(b.lon-a.lon)*t,h=Math.sin(x/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(y/2)**2;return 2*6371008.8*Math.asin(Math.min(1,Math.sqrt(h)));};

function initMap(){if(typeof L==='undefined'){$('map').innerHTML='<div class="note warn" style="margin:70px 14px">O mapa precisa de internet para carregar. A vistoria e o acompanhamento funcionam sem mapa.</div>';return;}

 LAY=L.layerGroup().addTo(MAP);TRAIL=L.layerGroup().addTo(MAP);MELAY=L.layerGroup().addTo(MAP);MAP.on('click',()=>{if($('sheet').classList.contains('full'))$('sheet').classList.remove('full');});

function drawRoute(pk,r,sel,run){if(!MAP)return;LAY.clearLayers();const b=L.latLngBounds([]);
 /* 2.5: itinerário ocioso (garagem → início e fim → garagem), tracejado cinza-escuro como na ferramenta */
 for(const x of r.idle||[]){const gi=dec(x.line);if(gi.length<2)continue;L.polyline(gi,{color:'#fff',weight:7,opacity:.8,interactive:false}).addTo(LAY);L.polyline(gi,{color:'#262b33',weight:4,dashArray:'9 7',opacity:.9}).bindTooltip('Ocioso '+(x.k==='idleOut'?'de saída (garagem → início)':'de volta (fim → garagem)')+(x.km!=null?' · '+String(x.km).replace('.',',')+' km':'')).addTo(LAY);gi.forEach(c=>b.extend(c));}
 const G=pk?.garage;if(G&&G.lat!=null&&(r.idle||[]).length){L.marker([G.lat,G.lon],{icon:L.divIcon({className:'',html:'<div class="mk" style="background:#262b33">G</div>',iconSize:[28,28],iconAnchor:[14,14]})}).bindTooltip(esc(G.name||'Garagem')).addTo(LAY);b.extend([G.lat,G.lon]);}const col=run?'#2563EB':r.dir==='VOLTA'?'#14b8a6':'#2563eb';const g=dec(r.line);if(g.length>1){L.polyline(g,{color:'#fff',weight:8,opacity:.9}).addTo(LAY);L.polyline(g,{color:col,weight:5}).addTo(LAY);g.forEach(c=>b.extend(c));}
 for(const t of[r.start,r.end])if(t&&t.lat!=null){L.marker([t.lat,t.lon],{icon:L.divIcon({className:'',html:'<div class="mk" style="background:#0b1d2e">'+(t===r.end?'D':'O')+'</div>',iconSize:[28,28],iconAnchor:[14,14]})}).bindTooltip(esc(t.name)).addTo(LAY);b.extend([t.lat,t.lon]);}
 r.stops.forEach((s,i)=>{b.extend([s.lat,s.lon]);const st=stOf(s);const m=L.marker([s.lat,s.lon],{icon:L.divIcon({className:'',html:'<div class="mk '+st+(sel===i?' sel':'')+'">'+(st==='feito'?'✓':s.n||i+1)+'</div>',iconSize:[28,28],iconAnchor:[14,14]}),zIndexOffset:sel===i?1000:0}).addTo(LAY);m.on('click',()=>go({v:'point',pk:pk.id,r:r.id,i}));});

/* ---------- GPS ---------- */
const ARROW='<svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="#fff"/><path d="M17 4 L26 27 L17 22 L8 27 Z" fill="#e11d48"/></svg>';

function gpsToggle(force){const want=force??!GPS_ON;if(!want){if(GPSW!=null)navigator.geolocation.clearWatch(GPSW);GPSW=null;GPS_ON=false;MELAY&&MELAY.clearLayers();$('btnGps').classList.remove('on');return;}
 if(GPS_ON)return;if(!navigator.geolocation){toast('Este navegador não tem GPS disponível.','warn');return;}if(!window.isSecureContext){toast(GPS_BLOCK,'bad',12000);return;}GPS_ON=true;$('btnGps').classList.add('on');let first=true;

  drawMe();if(MAP&&first&&!(AC&&AC.status==='run')){first=false;MAP.setView([GPS.lat,GPS.lon],Math.max(MAP.getZoom(),16));}const el=$('gpsInfo');if(el)el.innerHTML=gpsInfoHtml();if(AC&&AC.status==='run')acTick();},
  e=>{toast(e.code===1?(window.isSecureContext?'GPS sem permissão: toque no cadeado ao lado do endereço → Permissões → Localização → Permitir, e recarregue.':GPS_BLOCK):'GPS indisponível agora ('+e.message+').','warn',6000);if(!(AC&&AC.status==='run'))gpsToggle(false);},{enableHighAccuracy:true,maximumAge:3000,timeout:20000});}
function gpsInfoHtml(){const t=VIEW.v==='point'?curStop():null;if(!GPS)return GPS_ON?'<span class="mut">Procurando o GPS…</span>':'';const age=(Date.now()-GPS.at)/1000;return `📍 Você está ${t?'a <b>'+fmtM(dm(GPS,t))+'</b> do ponto · ':''}precisão ±${Math.round(GPS.acc)} m${age>30?' · leitura de '+Math.round(age)+' s atrás':''}`;}
const brg=(a,b)=>{const t=Math.PI/180,y=Math.sin((b.lon-a.lon)*t)*Math.cos(b.lat*t),x=Math.cos(a.lat*t)*Math.sin(b.lat*t)-Math.sin(a.lat*t)*Math.cos(b.lat*t)*Math.cos((b.lon-a.lon)*t);return(Math.atan2(y,x)/t+360)%360;};
/* distância (m) de um ponto até o traçado planejado (projeção plana local; suficiente na escala da cidade) */
function distLine(p,g){if(!g||g.length<2)return Infinity;const k=Math.cos(p.lat*Math.PI/180)*111320,K=110540;let best=Infinity;for(let i=1;i<g.length;i++){const ax=(g[i-1][1]-p.lon)*k,ay=(g[i-1][0]-p.lat)*K,bx=(g[i][1]-p.lon)*k,by=(g[i][0]-p.lat)*K,dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;let t=L2?-(ax*dx+ay*dy)/L2:0;t=Math.max(0,Math.min(1,t));const d=Math.hypot(ax+t*dx,ay+t*dy);if(d<best)best=d;}return best;}

 if(v==='home')return homeView();if(v==='vist')return vistView();if(v==='route')return routeView();if(v==='point')return pointView();if(v==='form')return formView();if(v==='send')return sendView();if(v==='envios')return enviosView();
 if(v==='acNew')return acNewView();if(v==='acHead')return acHeadView();if(v==='acRun')return acRunView();if(v==='acStop')return acStopView();if(v==='acEnd')return acEndView();}

const SST_FONTS='<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">';
const sysOf=(pk,s)=>(s?.pid&&pk?.vis?.[s.pid])||null;
const clsOf=x=>SST_CLS[x?.sst?.cls]||SST_CLS.nao_avaliado;
const verTxt=x=>{const l=(x.ver||[]).slice(-1)[0];return l?'v'+l.v+' por '+(l.by||'—')+' em '+fdate(l.at):'por '+(x.by||'—')+' em '+fdate(x.at);};
/* vistoria que uma nova substituiria: a do sistema ou uma já enviada deste celular (rascunho não enviado é só editado) */
function sstPrev(pk,s){const lo=resOf(s);if(lo&&!lo.sent)return null;return[lo,sysOf(pk,s)].filter(x=>x?.sst).sort((a,b)=>String(b.at).localeCompare(a.at))[0]||null;}
const sysNote=y=>`<div class="note ${clsOf(y)[1]}"><b>🦺 Vistoria no sistema: ${clsOf(y)[0]}</b>${y.sst?.nivel?' · risco '+esc(y.sst.nivel):''}<br>${esc(verTxt(y))}</div>`;
async function sstLineDoc(pk,r){const pts=r.stops.filter(s=>s.st!=='casa'),pages=[];
 for(let i=0;i<pts.length;i++){const s=pts[i],lo=resOf(s),v=[lo,sysOf(pk,s)].filter(x=>x?.sst).sort((a,b)=>String(b.at).localeCompare(a.at))[0]||null,ph=[];
  if(v&&v===lo){for(const id of(lo.photos||[]).slice(0,5)){const d=await DB.get('ph:'+id);if(d)ph.push(d);}}else if(v?.ph)ph.push(v.ph);
  pages.push(sstPageHtml({client:r.client||'',line:r.code||r.name,name:r.name||'',dir:r.dir,n:s.n||i+1,tot:pts.length,label:s.name,code:s.code||'',lat:s.lat,lon:s.lon,v:v&&{at:v.at,by:v.by,mat:v.mat,sst:v.sst,ver:v.ver,np:v===lo?(lo.photos||[]).length:(v.np||0)},ph,logo:pk.pub?.logo||'',flogo:'',company:pk.pub?.company||''}));}
 return sstDocHtml('Vistoria de segurança · '+(r.code||r.name)+' '+r.dir,pages,pk.pub?.color||'#0f3b5f',SST_FONTS);}
async function sstRel(pkId,rid){const pk=pkgOf(pkId),r=pk&&routeOf(pk,rid);if(!r)return;const html=await sstLineDoc(pk,r),blob=new Blob([html],{type:'text/html'}),
  name=('Vistoria de seguranca - '+(r.code||r.name)+' '+r.dir).replace(/[\\/:*?"<>|]+/g,'_')+'.html',feitas=r.stops.filter(s=>s.st!=='casa'&&(resOf(s)?.sst||sysOf(pk,s))).length,tot=r.stops.filter(s=>s.st!=='casa').length;
 const v=await modal(`<h3>📄 Relatório de segurança da linha</h3><p><b>${esc(r.code||r.name)} · ${esc(r.dir)}</b> — um ponto por página: ${feitas} de ${tot} vistoriado(s); o ponto sem vistoria sai como pendência.</p><p class="small mut">Para PDF: abra e toque em 🖨 Imprimir → Salvar como PDF (A4 deitado).</p>`,[{t:'👁 Abrir / imprimir (PDF)',c:'p',v:'open'},{t:'⬇ Baixar / compartilhar arquivo',v:'dl'},{t:'Fechar',v:''}]);
 if(v==='open'){const u=URL.createObjectURL(blob);if(!window.open(u,'_blank'))toast('O navegador bloqueou a nova aba: use “Baixar / compartilhar”.','warn',7000);setTimeout(()=>URL.revokeObjectURL(u),300000);}
 if(v==='dl'){if(navigator.canShare){try{const f=new File([blob],name,{type:'text/html'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Vistoria de segurança',text:(r.code||r.name)+' '+r.dir});return;}}catch(e){if(e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);toast('Relatório salvo em Downloads.','ok');}}
/* uma página A4 deitada por ponto, no formato do modelo do cliente. Só recebe dados — a MESMA função está no app de campo (mantenha iguais).
   d = {client,line,name,dir,n,tot,label,code,lat,lon,v:{at,by,mat,sst,ver,np}|null,ph:[dataURL],logo,flogo,company} */
function sstPageHtml(d){const v=d.v,o=v?.sst,line=d.line;
 const head=`<header>${d.logo?`<img src="${d.logo}" alt="">`:''}<div class="t"><h1>Vistoria de segurança do ponto de embarque</h1><small>${esc(d.client||'')} · Linha ${esc(line)} · ${esc(d.dir)} · ponto ${d.n} de ${d.tot}</small></div>${d.flogo?`<img src="${d.flogo}" alt="">`:''}</header>`;
 const ident=`<table class="kv"><tr><th>Rota</th><td>${esc(line)}${d.name&&d.name!==line?' — '+esc(d.name):''}</td></tr><tr><th>Identificação</th><td>${esc(d.label)}</td></tr><tr><th>Código</th><td>${esc(d.code||'—')} · ponto ${d.n}</td></tr><tr><th>Sentido</th><td>${esc(d.dir)}</td></tr><tr><th>Coordenadas</th><td>📍 ${(+d.lat).toFixed(6)}, ${(+d.lon).toFixed(6)}</td></tr><tr><th>Data da vistoria</th><td>${v?fdate(v.at):'—'}</td></tr><tr><th>Avaliador</th><td>${v?esc(v.by||'')+(v.mat?' · mat. '+esc(v.mat):''):'—'}</td></tr></table>`;
 const foot=`<footer>${esc(d.company||'')} · relatório gerado em ${new Date().toLocaleDateString('pt-BR')} · Estúdio de Rotas</footer>`;
 if(!o)return `<section class="pg">${head}<div class="r1 rp"><div class="ph none">Sem foto</div><div class="box"><h2>🗒 Identificação do ponto</h2>${ident}</div></div><div class="pend"><b>⚠ Vistoria pendente</b><p>Este ponto ainda não tem vistoria de segurança lançada. Faça a vistoria pelo app de campo (Vistoriar pontos) ou pelo Estúdio de Rotas (Acompanhamentos → 🦺 Segurança).</p></div>${foot}</section>`;
 const cls=SST_CLS[o.cls]||SST_CLS.nao_avaliado,mxc={Baixo:1,'Médio':2,Alto:3,'Muito alto':4},nc=o.nivel?mxc[o.nivel]:0,ph=d.ph||[];
 const mx=`<table class="mx"><tr><td class="ax" rowspan="7"><span>Probabilidade</span></td><td></td><th colspan="5">Severidade (consequência)</th></tr><tr><td></td>${SST_S.map((l,i)=>`<th>${i+1}<br><small>${l}</small></th>`).join('')}</tr>${[5,4,3,2,1].map(pp=>`<tr><th class="pl">${pp} ${SST_P[pp-1]}</th>${[1,2,3,4,5].map(ss=>`<td class="m${mxc[sstNivel(pp,ss)]}">${o.prob===pp&&o.sev===ss?'✕':''}</td>`).join('')}</tr>`).join('')}</table>`;
 const res=`<table class="kv res"><tr><th colspan="2" class="hd">Resultado da avaliação</th></tr><tr><th>Probabilidade</th><td>${o.prob?o.prob+' – '+SST_P[o.prob-1]:'—'}</td></tr><tr><th>Severidade</th><td>${o.sev?o.sev+' – '+SST_S[o.sev-1]:'—'}</td></tr><tr><th>Consequência</th><td>${esc(o.consq||'—')}</td></tr><tr><th>Nível de risco</th><td><span class="pill m${nc}">${esc(o.nivel||'—')}</span></td></tr><tr><th>Classificação</th><td><span class="pill ${cls[1]}">${cls[0]}</span></td></tr></table>`;
 const vl=(v.ver||[]).length?`<span class="vl">🗂 ${v.ver.map(x=>`v${x.v} realizada por ${esc(x.by||'—')}${x.mat?' (mat. '+esc(x.mat)+')':''} em ${fdate(x.at)}`).join(' · ')}</span>`:'';
 return `<section class="pg">${head}
 <div class="r1">${ph[0]?`<img class="ph" src="${ph[0]}" alt="Foto do ponto">`:'<div class="ph none">Sem foto</div>'}<div class="box"><h2>🗒 Identificação do ponto</h2>${ident}</div><div class="col"><div class="box"><h2>☑ Classificação do ponto</h2><div class="cls">${Object.entries(SST_CLS).map(([k,[l,cc]])=>`<div class="cb ${cc} ${o.cls===k?'on':''}">${o.cls===k?'☑':'☐'} ${l}</div>`).join('')}</div></div><div class="box"><h2>👁 Condição observada</h2><div class="obs">${esc(o.obs||'—')}</div></div></div></div>
 <div class="r2"><div class="box"><h2>⚠ Aspectos, agentes e riscos identificados</h2><table class="tb"><tr><th>Aspecto / condição</th><th>Agente de perigo</th><th>Risco identificado</th><th>Consequência potencial</th></tr>${(o.asp||[]).map(a=>`<tr><td>${esc(a.a)}</td><td>${esc(a.ag||'')}</td><td>${esc(a.ri||'')}</td><td>${esc(a.co||'')}</td></tr>`).join('')||'<tr><td colspan="4" class="mu">Nenhum aspecto de risco identificado.</td></tr>'}</table></div>
  <div class="box"><h2>📊 Avaliação de riscos — matriz de consequências</h2><div class="mxw">${mx}${res}</div></div></div>
 <div class="r2"><div class="box"><h2>⚙ Medidas de controle e recomendações</h2><table class="tb"><tr><th>Medida / orientação</th><th>Tipo de controle</th></tr>${(o.med||[]).map(m=>`<tr><td>☑ ${esc(m.t)}</td><td>${esc(m.tipo||'')}</td></tr>`).join('')||'<tr><td colspan="2" class="mu">Nenhuma medida indicada.</td></tr>'}</table></div>
  <div class="box"><h2>📋 Parecer técnico da vistoria</h2><div class="par"><div><small>Situação final do ponto</small><span class="pill big ${cls[1]}">${cls[0]}</span></div><div><b>Justificativa</b><p>${esc(o.just||'—')}</p>${o.rest?.length?`<b>Restrições e recomendações</b><ul>${o.rest.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}</div></div></div></div>
 <div class="ev"><b>📷 Evidências:</b> ${v.np||0} foto(s) do ponto${ph.length>1?ph.slice(1).map(t=>`<img src="${t}" alt="Foto">`).join(''):''}${vl}</div>${foot}</section>`;}
function sstDocHtml(title,pages,col,fonts){col=col||pubCfg().color||'#0f3b5f';fonts=fonts??PUB_FONTS;
 return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title>${fonts}<style>

/* ---------- vistoria de segurança do ponto (2.6) ---------- */
let FORM=null;
const sstRoute=()=>{const pk=pkgOf(VIEW.pk);return VIEW.r&&!String(VIEW.r).startsWith('§')?routeOf(pk,VIEW.r):null;};
async function formView(){const pk=pkgOf(VIEW.pk),s=curStop();if(!pk||!s)return go({v:'home'});const old=resOf(s),r=sstRoute();
 if(!FORM||FORM.key!==stopKey(s)){const o=old?.sst||{};FORM={key:stopKey(s),obs:o.obs||old?.notes||'',asp:new Set((o.asp||[]).map(a=>a.k).filter(Boolean)),aspX:(o.asp||[]).filter(a=>!a.k).map(a=>({...a})),prob:o.prob||0,sev:o.sev||0,cls:o.cls||'',med:new Set((o.med||[]).map(m=>m.t)),medX:(o.med||[]).filter(m=>!SST_MED.some(x=>x[0]===m.t)).map(m=>({...m})),just:o.just||'',rest:(o.rest||[]).join('\n'),photos:[...(old?.photos||[])],pos:old?.pos||null,usePos:!!old?.pos};}
 setHead('Vistoria de segurança',s.name);$('sheet').classList.add('full');const F=FORM;
 $('sheet').innerHTML=`<div class="grab" onclick="sheetSize()"></div><h2>🦺 ${esc(s.name)}</h2>
 <div class="kv"><span>Rota</span><b>${r?esc(r.code||r.name)+' · '+esc(r.dir):'—'}</b><span>Referência</span><b>${esc(s.ref||'—')}</b><span>Coordenadas</span><b>${(+s.lat).toFixed(6)}, ${(+s.lon).toFixed(6)}</b><span>Avaliador</span><b>${esc(ME||'—')}${MAT?' · mat. '+esc(MAT):''}</b></div>${!ME||!MAT?'<div class="note warn">Informe seu nome e matrícula (vão no relatório): <a href="#" onclick="setMe();return false">definir</a>.</div>':''}${sstPrev(pk,s)?`<div class="note warn">Este ponto já tem vistoria de segurança (${esc(clsOf(sstPrev(pk,s))[0])} · ${esc(verTxt(sstPrev(pk,s)))}). Ao salvar, você confirma se ela deve ser substituída.</div>`:''}
 <h3>Condição observada <i class="req">*</i></h3><textarea id="sObs" rows="3" placeholder="ex.: ponto em frente a comércio; calçada ampla e segura; sem cobertura" oninput="FORM.obs=this.value">${esc(F.obs)}</textarea>

 ${sstMxHtml()}${sstClsHtml()}${sstMedHtml()}

 <label class="f"><span>Restrições e recomendações (uma por linha)</span><textarea rows="3" placeholder="Manter orientações de segurança aos usuários" oninput="FORM.rest=this.value">${esc(F.rest)}</textarea></label>

 renderPhotos();posInfo();}
function sstAspXHtml(){const F=FORM;return `<div id="sstAspX">${F.aspX.map((a,i)=>`<div class="card" style="cursor:default"><div class="grow" style="min-width:0"><b>${esc(a.a)}</b><small>${esc(a.ag)} · ${esc(a.ri)} → ${esc(a.co)}</small></div><button class="sm bad" aria-label="Remover" onclick="FORM.aspX.splice(${i},1);sstUpd('sstAspX',sstAspXHtml)">✕</button></div>`).join('')}

function sstMxHtml(){const F=FORM,niv=F.prob&&F.sev?sstNivel(F.prob,F.sev):'',sug=niv?sstSug(niv):'',b=(k,v,l)=>`<button type="button" class="${F[k]===v?'on':''}" aria-pressed="${F[k]===v}" onclick="FORM.${k}=${v};sstUpd('sstMx',sstMxHtml);sstUpd('sstCls',sstClsHtml)"><b>${v}</b><small>${l}</small></button>`;
 return `<div id="sstMx"><h3>Matriz de risco <i class="req">*</i></h3><div class="small mut">Probabilidade</div><div class="sc5">${SST_P.map((l,i)=>b('prob',i+1,l)).join('')}</div><div class="small mut" style="margin-top:8px">Severidade (consequência)</div><div class="sc5">${SST_S.map((l,i)=>b('sev',i+1,l)).join('')}</div>
 <div class="note ${niv==='Baixo'?'ok':niv==='Médio'?'warn':niv?'bad':''}" style="margin-top:8px">Nível de risco: <b>${niv||'—'}</b>${niv?` (${F.prob} × ${F.sev}) · consequência: ${esc(SST_CONSQ[F.sev-1])} · sugestão: <b>${SST_CLS[sug][0]}</b>`:' — marque probabilidade e severidade'}</div></div>`;}
function sstClsHtml(){const F=FORM,niv=F.prob&&F.sev?sstNivel(F.prob,F.sev):'',sug=niv?sstSug(niv):'';return `<div id="sstCls"><h3>Classificação do ponto <i class="req">*</i></h3><div class="cls4">${Object.entries(SST_CLS).map(([k,[l,c]])=>`<button type="button" class="${c} ${F.cls===k?'on':''}" aria-pressed="${F.cls===k}" onclick="FORM.cls='${k}';sstUpd('sstCls',sstClsHtml)">${F.cls===k?'☑':'☐'} ${l}${k===sug&&F.cls!==k?'<small>sugerido</small>':''}</button>`).join('')}</div></div>`;}

/* 2.9.1: app abaixo da versão mínima do script → tela pedindo para recarregar (fila e lançamentos ficam guardados no celular) */
const appVer=()=>(/(\d+\.\d+(?:\.\d+)?)/.exec(APP)||[])[1]||'0';
function appOld(min){const x=appVer().split('.').map(Number),y=String(min).split('.').map(Number);let lt=false;for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0)){lt=(x[i]||0)<(y[i]||0);break;}}if(!lt)return false;if($('appOld'))return true;
 const d=document.createElement('div');d.id='appOld';d.setAttribute('role','alertdialog');d.setAttribute('aria-modal','true');d.style.cssText='position:fixed;inset:0;z-index:100000;background:rgba(15,23,42,.9);display:grid;place-items:center;padding:16px';
 d.innerHTML=`<div style="background:#fff;color:#0f172a;max-width:420px;border-radius:16px;padding:22px 20px;font:15px/1.45 system-ui,sans-serif"><h2 style="margin:0 0 8px;font-size:19px">⚠ Atualize o app</h2><p style="margin:0 0 14px">Este celular está com o <b>${esc(APP)}</b>; a equipe já usa a versão <b>${esc(min)}</b> ou mais nova. Os lançamentos e a fila de envio ficam guardados no celular.</p><button type="button" onclick="location.reload()" style="width:100%;padding:13px;border:0;border-radius:10px;background:#0e7490;color:#fff;font:700 16px system-ui,sans-serif">↻ Atualizar agora</button></div>`;
 document.body.append(d);return true;}
async function vistSend(keys){const items=[];for(const k of keys){const x=RES[k];if(!x)continue;const photos=[];for(const id of x.photos||[]){const d=await DB.get('ph:'+id);if(d)photos.push(d);}items.push({...x,photos});}if(!items.length)return;
 const nome='Vistoria_'+(ME||'campo').replace(/[^\wÀ-ú]+/g,'_')+'_'+(keys.length>1?new Date().toISOString().slice(0,19).replace(/[:T]/g,'-'):keys[0].replace(/[^\w]+/g,'_'))+'.json';
 return enviar(nome,{kind:'rota-studio-vistorias',v:1,app:APP,made:new Date().toISOString(),by:ME||'campo',items},{vist:items.map(x=>x.key)});}
/* ===================== 2.10 — envio com recibo, status ao vivo, problemas à vista e identificação =====================
 Cada envio vai sozinho (um erro não segura os outros), com nova tentativa em 30 s, 1, 5, 15 e 30 min. O servidor devolve um recibo
 (id do arquivo); o app confere a cada 30 s se o Estúdio de Rotas já importou (✓✓). Nada é apagado do aparelho: lançamentos e fotos
 ficam aqui até o ✓✓. Envio que falha 3 vezes abre a tela “Envios” (com “Tentar de novo” e “Salvar arquivo”). */
let IDENT=null,STALE=false;
const tfetch=(u,o={},ms=90000)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(u,{...o,signal:c.signal}).finally(()=>clearTimeout(t));};
const fdtm=s=>s?new Date(s).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'';
const envKind=d=>d?.kind==='rota-studio-acomp'?'Acompanhamento':'Vistoria';
function envLabel(f){const d=f.dados||{};if(d.kind==='rota-studio-acomp'){const h=d.acomp?.head||{};return 'Acompanhamento · '+[h.linha,h.sentido,fdt(h.data)].filter(Boolean).join(' · ');}const it=d.items||[];return 'Vistoria · '+(it.length>1?it.length+' pontos':it[0]?.name||'ponto');}
async function enviar(nome,dados,ref){FILA=FILA.filter(f=>f.nome!==nome&&!(ref?.ac&&f.ref?.ac===ref.ac));
 FILA.push({nome,dados,ref:ref||null,at:new Date().toISOString(),cid:uid(),tries:0});await saveAll();renderSt();return flush(true);}
function envMark(it,id){const now=new Date().toISOString(),set=x=>{x.sent=now;x.rid=id||'';delete x.prob;delete x.ok2;};
 if(it.ref?.ac){const h=HIST.find(x=>x.id===it.ref.ac);if(h)set(h);}for(const k of it.ref?.vist||[])if(RES[k])set(RES[k]);}
let FLUSHING=false;
async function flush(now){if(!CONN||FLUSHING||!navigator.onLine||!FILA.length){renderSt();return !FILA.length;}FLUSHING=true;let ok=0,nova=false;
 try{for(const it of FILA.slice()){if(!FILA.includes(it)||(!now&&it.next&&Date.now()<it.next))continue;
  try{const r=await tfetch(CONN.url,{method:'POST',body:JSON.stringify({t:CONN.key,nome:it.nome,dados:it.dados,cid:it.cid,app:appVer(),by:IDENT?.nome||ME||'',email:IDENT?.email||'',mat:IDENT?.mat||MAT||''})});
   const d=await r.json().catch(()=>({ok:false,erro:'o servidor não respondeu como o Estúdio de Rotas (HTTP '+r.status+') — link antigo ou script fora do ar'}));if(!d.ok)throw new Error(d.erro||'falhou');
   envMark(it,d.id);FILA=FILA.filter(x=>x!==it);ok++;await saveAll();}
  catch(e){const was=it.tries||0;it.tries=was+1;it.err=e.name==='AbortError'?'o servidor não respondeu em 90 s (internet lenta ou arquivo grande)':(e.message||'falhou');
   if(/chave inválida|não reconhecido/i.test(it.err))it.tries=Math.max(it.tries,3);it.next=Date.now()+[30,60,300,900,1800][Math.min(it.tries-1,4)]*1000;if(was<3&&it.tries>=3)nova=true;await saveAll();}}}
 finally{FLUSHING=false;}
 if(ok)toast('✓ '+ok+' envio(s) recebido(s) pelo Estúdio de Rotas.','ok');
 renderSt();if(['home','acEnd','vist','envios'].includes(VIEW.v))render();
 if(nova){if(['form','acRun','acStop','acHead','acNew'].includes(VIEW.v))toast('⚠ Envio com problema — toque no selo vermelho do topo para resolver.','bad',9000);else go({v:'envios'});}
 return !FILA.length;}
/* ✓✓: o Estúdio de Rotas importou o arquivo (o servidor diz onde ele está) */
async function envPoll(manual){if(!CONN||!navigator.onLine)return;const all=[...Object.values(RES),...HIST].filter(x=>x.sent&&x.rid&&!x.ok2),ids=[...new Set(all.map(x=>x.rid))].slice(0,40);
 if(!ids.length){if(manual)toast('Nada aguardando confirmação.','ok');return;}
 try{const j=await tfetch(connUrl('campo=status&t='+encodeURIComponent(CONN.key)+'&ids='+encodeURIComponent(ids.join(','))),{},30000).then(r=>r.json());if(!j?.ok||!j.st)throw new Error(j?.erro||'o servidor ainda não tem a conferência (script antigo)');let n=0;
  for(const x of all){const s=j.st[x.rid];if(!s)continue;if(s.s==='importado'){x.ok2=new Date().toISOString();delete x.prob;n++;}else if(s.s==='problema')x.prob=s.erro||'erro na importação';else if(s.s==='sumiu')x.prob='o arquivo não foi encontrado no servidor — envie de novo';}
  await saveAll();renderSt();if(VIEW.v==='envios'||(n&&['home','vist','acEnd'].includes(VIEW.v)))render();if(manual)toast(n?'✓✓ '+n+' lançamento(s) confirmado(s) no sistema.':'Conferido: ainda aguardando o Estúdio de Rotas importar.','ok');}
 catch(e){if(manual)toast('Não consegui conferir: '+e.message,'bad',7000);}}
async function envResend(k,id){if(k==='ac'){const i=HIST.findIndex(a=>a.id===id);if(i<0)return;for(const f of['prob','rid','sent','ok2'])delete HIST[i][f];await acCloud(i);}else{const x=RES[id];if(!x)return;for(const f of['prob','rid','sent','ok2'])delete x[f];await vistSend([id]);}render();}
function envRetry(i){const f=FILA[i];if(!f)return;f.next=0;flush(true);toast('Enviando de novo…','ok',2500);}
function envSave(i){const f=FILA[i];if(!f)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(f.dados)],{type:'application/json'}));a.download=f.nome;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);
 toast('Arquivo salvo. Ele continua na fila: o envio segue tentando sozinho.','ok',7000);}
function envState(){const sent=[...Object.values(RES),...HIST].filter(x=>x.sent);return{fila:FILA.length,err:FILA.filter(f=>(f.tries||0)>=3).length,wait:sent.filter(x=>x.rid&&!x.ok2&&!x.prob).length,prob:sent.filter(x=>x.prob&&!x.ok2).length};}
function renderSt(){const b=$('btnSt');if(!b)return;const s=envState(),bad=s.err+s.prob;if(!CONN&&!s.fila){b.hidden=true;return;}b.hidden=false;
 const[k,ic,n,t]=bad?['bad','⚠',bad,'com problema']:s.fila?['run','⏳',s.fila,'enviando']:s.wait?['wait','✓',s.wait,'aguardando o Estúdio']:['ok','✓✓','','tudo no sistema'];
 b.className='stpill '+k;b.innerHTML=`<span>${ic}${n?' '+n:''}</span><span class="sl"> ${t}</span>`;b.title='Envios ao Estúdio de Rotas: '+(n?n+' ':'')+t;b.setAttribute('aria-label',b.title);}
function enviosView(){setHead('Envios ao Estúdio de Rotas',CONN?(navigator.onLine?'conectado':'sem internet agora — tudo fica guardado neste aparelho'):'sem conexão com o Estúdio de Rotas');if(MAP){LAY.clearLayers();}
 const s=envState(),bad=s.err+s.prob,sent=[...HIST.map(a=>({k:'ac',id:a.id,x:a,label:'Acompanhamento · '+[a.head?.linha,a.head?.sentido,fdt(a.head?.data)].filter(Boolean).join(' · ')})),...Object.values(RES).map(x=>({k:'vi',id:x.key,x,label:'Vistoria · '+(x.name||'ponto')}))].filter(o=>o.x.sent).sort((a,b)=>(a.x.ok2?1:0)-(b.x.ok2?1:0)||String(b.x.sent).localeCompare(String(a.x.sent))).slice(0,80);
 let h=`<div class="grab" onclick="sheetSize()"></div><div class="note ${bad?'bad':s.fila?'warn':'ok'}">${bad?`<b>⚠ ${bad} envio(s) com problema.</b> Tente de novo ou salve o arquivo e mande para o responsável pelo Estúdio de Rotas.`:s.fila?`<b>⏳ ${s.fila} envio(s) saindo deste aparelho.</b>`:s.wait?`<b>✓ ${s.wait} recebido(s) pelo servidor</b>, aguardando o Estúdio de Rotas importar (alguém precisa estar com ele aberto).`:'<b>✓✓ Tudo o que saiu deste aparelho está no sistema.</b>'}</div>
 <p class="small mut">⏳ no aparelho → ✓ recebido pelo servidor → ✓✓ no sistema. Os lançamentos e as fotos ficam guardados aqui até o ✓✓.</p>`;
 if(!CONN)h+=`<button class="big" onclick="campoConnect()"><span class="ic">☁</span><span><b>Conectar ao Estúdio de Rotas</b><small>Sem conexão, os envios esperam neste aparelho.</small></span></button>`;
 if(FILA.length)h+=`<h3>Saindo deste aparelho (${FILA.length})</h3>`+FILA.map((f,i)=>`<div class="card env"><span class="num ${(f.tries||0)>=3?'reprovado':'proposto'}">${(f.tries||0)>=3?'!':'⏳'}</span><div class="grow" style="min-width:0"><b>${esc(envLabel(f))}</b><small>${f.err?'<span style="color:var(--bad)">'+esc(f.err)+'</span> · '+f.tries+' tentativa(s)':'na fila desde '+fdtm(f.at)}${f.next&&f.next>Date.now()?' · nova tentativa às '+new Date(f.next).toLocaleTimeString('pt-BR',{timeStyle:'short'}):''}</small></div><div class="eact"><button class="sm" onclick="envRetry(${i})">Tentar de novo</button><button class="sm" onclick="envSave(${i})">Salvar arquivo</button></div></div>`).join('');
 h+=`<h3>Enviados (${sent.length})</h3>`+(sent.map(o=>`<div class="card env"><span class="num ${o.x.ok2?'validado':o.x.prob?'reprovado':'feito'}">${o.x.ok2?'✓✓':o.x.prob?'!':'✓'}</span><div class="grow" style="min-width:0"><b>${esc(o.label)}</b><small>${o.x.ok2?'No sistema · confirmado em '+fdtm(o.x.ok2):o.x.prob?'<span style="color:var(--bad)">'+esc(o.x.prob)+'</span>':o.x.rid?'Recebido em '+fdtm(o.x.sent)+' · aguardando o Estúdio de Rotas importar':'Enviado em '+fdtm(o.x.sent)+' (versão antiga do app, sem recibo)'}</small></div>${o.x.prob&&!o.x.ok2?`<div class="eact"><button class="sm" onclick="envResend('${o.k}','${esc(o.id)}')">Enviar de novo</button></div>`:''}</div>`).join('')||'<p class="small mut">Nada enviado ainda deste aparelho.</p>');
 h+=`<div class="btns"><button class="p" onclick="flush(true)">↻ Enviar agora</button><button onclick="envPoll(true)">Conferir no sistema</button></div>`;
 $('sheet').innerHTML=h;}
/* ---------- base desatualizada / link antigo ---------- */
function linkCheck(lk){if(!CONN||!lk||lk===CONN.url||!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(lk))return;CONN.url=lk;saveAll();toast('Conexão atualizada para o endereço atual do Estúdio de Rotas.','ok',7000);}
function staleCheck(){if(!CONN||!navigator.onLine||!CONN.err||STALE||$('staleBox')||$('identBox'))return;const last=CONN.okAt||CONN.at,age=last?Date.now()-Date.parse(last):Infinity;if(age<864e5)return;STALE=true;
 const why=/Unexpected token|JSON|not valid/i.test(CONN.err)?'o endereço da conexão não respondeu como o Estúdio de Rotas (link antigo ou script fora do ar)':CONN.err;
 const d=document.createElement('div');d.id='staleBox';d.className='ovl';d.setAttribute('role','alertdialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-labelledby','stT');
 d.innerHTML=`<div class="obox"><h2 id="stT">⚠ Base desatualizada</h2><p>Este aparelho não consegue atualizar a base do Estúdio de Rotas${last?' desde <b>'+esc(fdtm(last))+'</b>':''}.</p><p class="small mut">Motivo: ${esc(why)}.</p><p class="small">Seus lançamentos e a fila de envio continuam guardados aqui.</p>
 <div class="btns one"><button class="p" id="stR">↻ Atualizar base</button><button id="stC">Colar código de conexão novo</button><button id="stX">Continuar assim</button></div></div>`;
 document.body.append(d);$('stR').focus();const close=()=>d.remove();
 $('stR').onclick=async()=>{$('stR').textContent='Atualizando…';await campoSync(true);if(!CONN?.err){close();STALE=false;}else $('stR').textContent='↻ Tentar de novo';};$('stC').onclick=()=>{close();STALE=false;campoConnect();};$('stX').onclick=close;}
/* ---------- identificação: nome completo, e-mail e matrícula (mesma conferência do Estúdio de Rotas) ---------- */
function identGate(force,msg){if(!force&&IDENT?.nome)return;if(!force&&AC&&AC.status==='run')return;$('identBox')?.remove();
 const d=document.createElement('div');d.id='identBox';d.className='ovl';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.setAttribute('aria-labelledby','idT');
 d.innerHTML=`<form class="obox" id="idF" novalidate><h2 id="idT">Quem está usando o app?</h2><p class="small mut">Os seus lançamentos e envios levam estes dados. Use os mesmos do Estúdio de Rotas no computador.</p>
 <label><span>Nome completo</span><input id="idN" autocomplete="name" value="${esc(IDENT?.nome||ME||'')}"></label><label><span>E-mail</span><input id="idE" type="email" autocomplete="email" value="${esc(IDENT?.email||'')}"></label><label><span>Matrícula</span><input id="idM" inputmode="numeric" value="${esc(IDENT?.mat||MAT||'')}"></label>
 <p class="small" id="idErr" role="alert" style="color:var(--bad);min-height:1.2em;margin:6px 0">${esc(msg||'')}</p><button class="p" style="width:100%">Continuar</button></form>`;
 document.body.append(d);$('idN').focus();
 $('idF').onsubmit=async e=>{e.preventDefault();const nome=$('idN').value.trim().replace(/\s+/g,' '),email=$('idE').value.trim().toLowerCase(),mat=$('idM').value.trim().replace(/\s+/g,''),er=t=>{$('idErr').textContent=t;};
  if(nome.split(' ').length<2)return er('Informe o nome completo (nome e sobrenome).');if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return er('E-mail inválido.');if(!/^[0-9A-Za-z.\-]{2,30}$/.test(mat))return er('Matrícula inválida (use só números e letras).');
  let ok=false;if(CONN&&navigator.onLine){er('Conferindo…');try{const j=await tfetch(CONN.url,{method:'POST',body:JSON.stringify({t:CONN.key,acao:'usuario',nome,email,mat})},30000).then(r=>r.json());if(j.ok===false)return er(j.erro||'Não foi possível conferir.');ok=!!j.ok;}catch{}er('');}
  IDENT={nome,email,mat,ok};ME=nome;MAT=mat;await saveAll();d.remove();render();staleCheck();toast(ok?'Identificação confirmada.':'Identificação guardada — confiro quando houver conexão.','ok');};}
async function identVerify(){if(!IDENT?.nome||IDENT.ok||!CONN||!navigator.onLine)return;try{const j=await tfetch(CONN.url,{method:'POST',body:JSON.stringify({t:CONN.key,acao:'usuario',nome:IDENT.nome,email:IDENT.email,mat:IDENT.mat})},30000).then(r=>r.json());
 if(j.ok){IDENT.ok=true;await saveAll();}else if(j.ok===false&&!/chave/i.test(j.erro||''))identGate(true,j.erro);}catch{}}
function dnavSync(){const v=VIEW.v,g=['vist','route','point','form','send'].includes(v)?'vist':v;document.querySelectorAll('#dnav [data-go]').forEach(b=>b.setAttribute('aria-current',b.dataset.go===g?'page':'false'));}
setInterval(()=>{if(CONN&&navigator.onLine){flush();envPoll();identVerify();}},30000);
addEventListener('keydown',e=>{if(e.key==='Escape'&&!['form','acStop','acHead'].includes(VIEW.v)&&!$('identBox')&&!$('staleBox')&&$('modal').hidden&&!$('btnBack').hidden)$('btnBack').click();});
window.addEventListener('online',()=>flush());
document.addEventListener('DOMContentLoaded',boot);
</script>
</body></html>
