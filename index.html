<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--b:#0f3b5f;--a:#0e7490;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--ink:#17212c;--mut:#5f6f80;--line:#e2e7ee;--soft:#f3f6f9;--ida:#2563eb;--volta:#14b8a6;color-scheme:light}

.bar{height:8px;border-radius:5px;background:var(--soft);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
.note{border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0;background:#e0f2f5;color:#0b4f5f}.note.warn{background:#fff4e0;color:#7a3f02}.note.bad{background:#fdecec;color:#7f1414}.note.ok{background:#e8f6ec;color:#0f5a2b}

textarea,input[type=text],input[type=search],input[type=date],input[type=time],input[type=number],select{width:100%;border:1px solid #c5cfda;border-radius:12px;padding:11px 12px;font-size:16px;background:#fff;color:var(--ink)}

.big .ic{font-size:30px;line-height:1}.big b{display:block;font-size:16.5px}.big small{display:block;color:var(--mut);font-size:13px;font-weight:400;margin-top:2px}.big.on{border-color:var(--a);background:#e6f4f7}
.f{margin:8px 0}.f>span{display:block;font-weight:650;font-size:14px;margin-bottom:4px}.f>span i{color:var(--bad);font-style:normal}.hint{display:block;font-size:12.5px;color:var(--mut);margin-top:3px}

details.help{background:#eef6fb;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:13.5px}details.help summary{cursor:pointer;font-weight:650;color:var(--b)}details.help p{margin:6px 0}

.hud .nx{font-size:13px;opacity:.85}.hud .nm{font-size:19px;font-weight:750;line-height:1.15}.hud .ds{font-size:28px;font-weight:800;text-align:right;line-height:1}.hud .ds small{display:block;font-size:12px;font-weight:500;opacity:.8}
.hud .st{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap;font-size:14px}.hud .st b{font-size:17px}
.hud.at{background:#065f46}.hud.off{background:#7f1d1d}

.banner.off{background:#b91c1c;color:#fff}.banner.end{background:#065f46;color:#fff}.banner button{background:#fff;color:#065f46;min-height:40px}
.runbar{position:fixed;left:0;right:0;bottom:0;z-index:999;background:#fff;padding:10px 12px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px #0f2a4433;display:grid;grid-template-columns:1fr auto auto;gap:8px}
.runbar .stop{background:#c2410c;color:#fff;font-size:20px;min-height:64px;border-radius:16px}
.runbar .aux{min-height:64px;font-size:13px;padding:8px 10px;border-radius:16px}
.ctr{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:center}.ctr button{min-height:56px;font-size:26px;padding:0}.ctr output{font-size:30px;font-weight:800;text-align:center}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.kpis div{background:var(--soft);border-radius:12px;padding:10px}.kpis b{display:block;font-size:22px}.kpis span{font-size:12.5px;color:var(--mut)}.kpis .ok b{color:var(--ok)}.kpis .bad b{color:var(--bad)}
#map.nav{transition:transform .8s linear;transform-origin:50% 50%}#map.nav .leaflet-control-container{display:none}#map.nav .mk{transform:rotate(var(--hd,0deg))}
.running .layerbtn,.running .gpsbtn{display:none}.running .toast{top:auto;bottom:100px}.running .leaflet-bottom{bottom:96px}
.mot{display:grid;gap:6px}.mot label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-weight:600;font-size:14.5px}.mot input{width:22px;height:22px}.mot label.on{border-color:var(--bad);background:#fdecec}

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
'use strict';
/* ===================== Estúdio de Rotas Campo 2.0 — acompanhamento de linha e vistoria de pontos no celular =====================
 Abre o “pacote de campo” gerado no Estúdio de Rotas (computador): rotas, pontos, horários e quantidade de passageiros — sem nomes.
 Acompanhamento (2.0): Modo A (no ônibus com o motorista: cabeçalho + checklist do “Controle de acompanhamento de linha”) ou
 Modo B (acompanhamento individual de carro ou ônibus). GPS contínuo, paradas com raio de tolerância, embarques/desembarques,
 fechamento com métricas e arquivo para importar no computador. Vistoria de pontos: checklist, fotos e posição pelo GPS.
 Tudo fica guardado no próprio celular até ser enviado. */
const APP='Estúdio de Rotas Campo 2.3.1 · by Davi';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=(p='i')=>p+Date.now().toString(36).slice(-6)+Math.random().toString(36).slice(2,6);
const dm=(a,b)=>{const t=Math.PI/180,x=(b.lat-a.lat)*t,y=(b.lon-a.lon)*t,h=Math.sin(x/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(y/2)**2;return 2*6371008.8*Math.asin(Math.min(1,Math.sqrt(h)));};
const fmtM=m=>m>=1000?(m/1000).toLocaleString('pt-BR',{maximumFractionDigits:1})+' km':Math.round(m)+' m';
function dec(s){if(!s)return[];let i=0,la=0,lo=0;const o=[];while(i<s.length){for(let k=0;k<2;k++){let sh=0,r=0,b;do{b=s.charCodeAt(i++)-63;r|=(b&31)<<sh;sh+=5;}while(b>=32);const d=r&1?~(r>>1):r>>1;if(k)lo+=d;else la+=d;}o.push([la/1e6,lo/1e6]);}return o;}
function toast(m,k='',ms=4500){const el=$('toast');const d=document.createElement('div');d.className=k;d.textContent=m;el.prepend(d);while(el.children.length>3)el.lastChild.remove();setTimeout(()=>d.remove(),ms);}
/* ---------- armazenamento no celular (IndexedDB → localStorage → memória) ---------- */
const DB={db:null,mem:new Map(),mode:'mem',
 open(){return new Promise(res=>{try{const rq=indexedDB.open('rota-studio-campo',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');rq.onsuccess=()=>{this.db=rq.result;this.mode='idb';res(true);};rq.onerror=()=>res(false);rq.onblocked=()=>res(false);}catch{res(false);}}).then(ok=>{if(!ok){try{localStorage.setItem('rsc:t','1');localStorage.removeItem('rsc:t');this.mode='ls';}catch{this.mode='mem';}}return this.mode;});},
 get(k){if(this.mode==='idb')return new Promise(res=>{try{const q=this.db.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=()=>res(q.result??null);q.onerror=()=>res(null);}catch{res(null);}});if(this.mode==='ls'){try{return Promise.resolve(JSON.parse(localStorage.getItem('rsc:'+k)||'null'));}catch{return Promise.resolve(null);}}return Promise.resolve(this.mem.get(k)??null);},
 set(k,v){if(this.mode==='idb')return new Promise((res,rej)=>{try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>rej(tx.error);}catch(e){rej(e);}});if(this.mode==='ls'){try{localStorage.setItem('rsc:'+k,JSON.stringify(v));return Promise.resolve(true);}catch(e){return Promise.reject(e);}}this.mem.set(k,v);return Promise.resolve(true);},
 del(k){if(this.mode==='idb')return new Promise(res=>{try{const tx=this.db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch{res(false);}});if(this.mode==='ls'){try{localStorage.removeItem('rsc:'+k);}catch{}}this.mem.delete(k);return Promise.resolve(true);}};
/* ---------- estado ---------- */
let PKGS=[];          // pacotes abertos (sem fotos)
let RES={};           // resultados: chave do ponto → vistoria (fotos ficam à parte: 'ph:<id>')
let ME='';            // nome do vistoriador
let MAT='';           // matrícula de quem está em campo
let AC=null;          // acompanhamento em andamento
let HIST=[];          // acompanhamentos encerrados (fotos à parte: 'ph:<id>')
let CONN=null;        // conexão com o Estúdio de Rotas: {url do Apps Script, chave, at = última base baixada}
let FILA=[];          // envios esperando internet: {nome,dados,ref}
let VIEW={v:'home'};  // tela atual
let GPS=null,GPSW=null,GPS_ON=false;
const DEF_CHECKS=[['luz','Iluminação adequada'],['calcada','Calçada / área de espera segura'],['parada','Espaço para o ônibus parar sem bloquear a via'],['visao','Boa visibilidade (longe de curva, lombada e esquina)'],['travessia','Passageiro não precisa atravessar via perigosa'],['abrigo','Abrigo / proteção contra sol e chuva'],['acess','Acessível (rampa, piso regular)']];
const RESULTS={aprovado:['Aprovado','ok'],ressalva:['Aprovado com ressalva','warn'],reprovado:['Reprovado','bad']};
const ST_TXT={validado:['Validado','ok'],proposto:['A vistoriar','warn'],reprovado:['Reprovado','bad'],casa:['Endereço (porta a porta)',''],inativo:['Inativo','']};
/* configuração do acompanhamento: vem do pacote (Estúdio de Rotas → Acompanhamentos); sem ela, estes padrões */
const AC_DEF={tol:50,offRoute:150,motivos:['Ponto de embarque incorreto','Motorista parou fora do ponto programado','Novo ponto solicitado / não cadastrado','Desvio por obra / trânsito','Parada de emergência / segurança']};
/* checklist do formulário “Controle de acompanhamento de linha” (PDF). ok = respostas conformes */
const CK=[
 {k:'cracha',l:'Crachá com treinamento válido',t:'sn',ok:['Sim'],obs:1,h:'O motorista está com o crachá e o treinamento válidos?'},
 {k:'cklist',l:'Check-list preenchido corretamente',t:'sn',ok:['Sim'],obs:1,h:'O check-list do veículo do dia está preenchido corretamente?'},
 {k:'art',l:'ART',t:'sn',ok:['Sim'],obs:1,h:'A ART está no veículo e em dia?'},
 {k:'alerta',l:'Sempre Alerta',t:'sn',ok:['Sim'],obs:1,h:'O item Sempre Alerta está conforme?'},
 {k:'extintor',l:'Validade do extintor de incêndio',t:'date',h:'Informe a data de validade escrita no extintor. Vencido = não conforme.'},
 {k:'kit',l:'Kit primeiros socorros',t:'opt',o:['Não possui','Possui (lacrado)','Possui (aberto)'],ok:['Possui (lacrado)'],h:'Lacrado = completo e intacto. Aberto ou ausente = não conforme.'},
 {k:'painel',l:'Erro no painel',t:'opt',o:['Não possui','Possui'],ok:['Não possui'],desc:'Possui',h:'Há alguma luz de erro ou alerta acesa no painel? Se houver, descreva o problema.'},
 {k:'roleta',l:'Roleta travada',t:'opt',o:['Não','Sim'],ok:['Não'],h:'A roleta está travando a passagem? “Sim” = não conforme.'},
 {k:'visor',l:'Visor de velocidade',t:'opt',o:['Sim','Não'],ok:['Sim'],h:'O visor de velocidade para os passageiros está funcionando?'},
 {k:'calco',l:'Calço',t:'opt',o:['Completo (calço e corrente)','Incompleto','Não possui'],ok:['Completo (calço e corrente)'],desc:'Incompleto',h:'Calço de roda com corrente. Se estiver incompleto, descreva o que falta.'}];
const saveAll=()=>Promise.all([DB.set('pkgs',PKGS),DB.set('res',RES),DB.set('me',ME),DB.set('mat',MAT),DB.set('ac',AC),DB.set('hist',HIST),DB.set('conn',CONN),DB.set('fila',FILA)]).catch(e=>toast('Não foi possível guardar no celular: '+e.message+'. Envie o resultado antes de fechar.','bad',9000));
const pkgOf=id=>PKGS.find(p=>p.id===id);
const routeOf=(pk,rid)=>pk?.routes.find(r=>r.id===rid);
const stopKey=s=>s.pid?'p:'+s.pid:s.key;
const resOf=s=>RES[stopKey(s)];
const stOf=s=>{const r=resOf(s);if(r)return 'feito';return s.st||'proposto';};
const needs=s=>s.st==='proposto'||s.st==='reprovado';
function routeProg(r){const list=r.stops.filter(s=>s.st!=='casa');const need=list.filter(needs);return{tot:list.length,need:need.length,done:list.filter(s=>resOf(s)).length,needDone:need.filter(s=>resOf(s)).length};}
const pendingExport=()=>Object.values(RES).filter(x=>!x.sent).length;
/* ---------- mapa ---------- */
let MAP,LAY,MELAY,TRAIL,TILES={},TILE='ruas';
function initMap(){if(typeof L==='undefined'){$('map').innerHTML='<div class="note warn" style="margin:70px 14px">O mapa precisa de internet para carregar. A vistoria e o acompanhamento funcionam sem mapa.</div>';return;}
 MAP=L.map('map',{zoomControl:false,attributionControl:true}).setView([-17.22,-46.87],13);L.control.zoom({position:'bottomright'}).addTo(MAP);MAP.attributionControl.setPrefix('');
 TILES.ruas=L.tileLayer('https://tile.openstreetmap.de/{z}/{x}/{y}.png',{maxZoom:20,maxNativeZoom:18,attribution:'© colaboradores do <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
 TILES.sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:19,attribution:'Imagens © Esri'});
 TILES.ruas.addTo(MAP);let te=0;TILES.ruas.on('tileerror',()=>{if(++te===8&&TILE==='ruas'){MAP.removeLayer(TILES.ruas);TILES.ruas=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,maxNativeZoom:19,attribution:'Tiles © Esri'}).addTo(MAP);}});
 LAY=L.layerGroup().addTo(MAP);TRAIL=L.layerGroup().addTo(MAP);MELAY=L.layerGroup().addTo(MAP);MAP.on('click',()=>{if($('sheet').classList.contains('full'))$('sheet').classList.remove('full');});
 MAP.on('dragstart',()=>{if(AC&&AC.status==='run'&&AC.follow){AC.follow=false;navSet(false);runBar();}});}
function toggleTiles(){if(!MAP)return;MAP.removeLayer(TILES[TILE]);TILE=TILE==='ruas'?'sat':'ruas';TILES[TILE].addTo(MAP);$('btnLayer').textContent=TILE==='ruas'?'🛰 Satélite':'🗺 Ruas';}
function drawRoute(pk,r,sel){if(!MAP)return;LAY.clearLayers();const b=L.latLngBounds([]);const col=r.dir==='VOLTA'?'#14b8a6':'#2563eb';const g=dec(r.line);if(g.length>1){L.polyline(g,{color:'#fff',weight:8,opacity:.9}).addTo(LAY);L.polyline(g,{color:col,weight:5}).addTo(LAY);g.forEach(c=>b.extend(c));}
 for(const t of[r.start,r.end])if(t&&t.lat!=null){L.marker([t.lat,t.lon],{icon:L.divIcon({className:'',html:'<div class="mk" style="background:#0b1d2e">'+(t===r.end?'D':'O')+'</div>',iconSize:[28,28],iconAnchor:[14,14]})}).bindTooltip(esc(t.name)).addTo(LAY);b.extend([t.lat,t.lon]);}
 r.stops.forEach((s,i)=>{b.extend([s.lat,s.lon]);const st=stOf(s);const m=L.marker([s.lat,s.lon],{icon:L.divIcon({className:'',html:'<div class="mk '+st+(sel===i?' sel':'')+'">'+(st==='feito'?'✓':s.n||i+1)+'</div>',iconSize:[28,28],iconAnchor:[14,14]}),zIndexOffset:sel===i?1000:0}).addTo(LAY);m.on('click',()=>go({v:'point',pk:pk.id,r:r.id,i}));});
 if(sel!=null&&r.stops[sel])MAP.setView([r.stops[sel].lat,r.stops[sel].lon],Math.max(MAP.getZoom(),17));else if(b.isValid())MAP.fitBounds(b.pad(.1));}
function drawPoints(pk,list,sel){if(!MAP)return;LAY.clearLayers();const b=L.latLngBounds([]);list.forEach((s,i)=>{b.extend([s.lat,s.lon]);const st=stOf(s);L.marker([s.lat,s.lon],{icon:L.divIcon({className:'',html:'<div class="mk '+st+(sel===i?' sel':'')+'">'+(st==='feito'?'✓':'•')+'</div>',iconSize:[28,28],iconAnchor:[14,14]})}).addTo(LAY).on('click',()=>go({v:'point',pk:pk.id,r:'§avulsos',i}));});if(sel!=null&&list[sel])MAP.setView([list[sel].lat,list[sel].lon],17);else if(b.isValid())MAP.fitBounds(b.pad(.1));}

const ARROW='<svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="#fff"/><path d="M17 4 L26 27 L17 22 L8 27 Z" fill="#e11d48"/></svg>';
function drawMe(){if(!MAP||!GPS)return;MELAY.clearLayers();L.circle([GPS.lat,GPS.lon],{radius:Math.min(GPS.acc,200),color:'#e11d48',weight:1,fillOpacity:.08,interactive:false}).addTo(MELAY);

function gpsToggle(force){const want=force??!GPS_ON;if(!want){if(GPSW!=null)navigator.geolocation.clearWatch(GPSW);GPSW=null;GPS_ON=false;MELAY&&MELAY.clearLayers();$('btnGps').classList.remove('on');return;}
 if(GPS_ON)return;if(!navigator.geolocation){toast('Este navegador não tem GPS disponível.','warn');return;}if(!window.isSecureContext){toast(GPS_BLOCK,'bad',12000);return;}GPS_ON=true;$('btnGps').classList.add('on');let first=true;
 GPSW=navigator.geolocation.watchPosition(p=>{const prev=GPS;const c=p.coords;GPS={lat:c.latitude,lon:c.longitude,acc:c.accuracy,at:Date.now()};
  /* velocidade e rumo: do GPS; sem eles, calculados entre as duas últimas leituras */
  const dd=prev?dm(prev,GPS):0,dt=prev?(GPS.at-prev.at)/1000:0;GPS.kmh=c.speed!=null&&c.speed>=0?c.speed*3.6:(dt>0&&dd>2?dd/dt*3.6:0);GPS.hd=c.heading!=null&&!isNaN(c.heading)?c.heading:(prev&&dd>5?brg(prev,GPS):prev?.hd||0);
  drawMe();if(MAP&&first&&!(AC&&AC.status==='run')){first=false;MAP.setView([GPS.lat,GPS.lon],Math.max(MAP.getZoom(),16));}const el=$('gpsInfo');if(el)el.innerHTML=gpsInfoHtml();if(AC&&AC.status==='run')acTick();},
  e=>{toast(e.code===1?(window.isSecureContext?'GPS sem permissão: toque no cadeado ao lado do endereço → Permissões → Localização → Permitir, e recarregue.':GPS_BLOCK):'GPS indisponível agora ('+e.message+').','warn',6000);if(!(AC&&AC.status==='run'))gpsToggle(false);},{enableHighAccuracy:true,maximumAge:3000,timeout:20000});}
function gpsInfoHtml(){const t=VIEW.v==='point'?curStop():null;if(!GPS)return GPS_ON?'<span class="mut">Procurando o GPS…</span>':'';const age=(Date.now()-GPS.at)/1000;return `📍 Você está ${t?'a <b>'+fmtM(dm(GPS,t))+'</b> do ponto · ':''}precisão ±${Math.round(GPS.acc)} m${age>30?' · leitura de '+Math.round(age)+' s atrás':''}`;}
const brg=(a,b)=>{const t=Math.PI/180,y=Math.sin((b.lon-a.lon)*t)*Math.cos(b.lat*t),x=Math.cos(a.lat*t)*Math.sin(b.lat*t)-Math.sin(a.lat*t)*Math.cos(b.lat*t)*Math.cos((b.lon-a.lon)*t);return(Math.atan2(y,x)/t+360)%360;};
/* distância (m) de um ponto até o traçado planejado (projeção plana local; suficiente na escala da cidade) */
function distLine(p,g){if(!g||g.length<2)return Infinity;const k=Math.cos(p.lat*Math.PI/180)*111320,K=110540;let best=Infinity;for(let i=1;i<g.length;i++){const ax=(g[i-1][1]-p.lon)*k,ay=(g[i-1][0]-p.lat)*K,bx=(g[i][1]-p.lon)*k,by=(g[i][0]-p.lat)*K,dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;let t=L2?-(ax*dx+ay*dy)/L2:0;t=Math.max(0,Math.min(1,t));const d=Math.hypot(ax+t*dx,ay+t*dy);if(d<best)best=d;}return best;}

function shrink(file,max=1280,q=0.72){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(fr.error);fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q));};im.onerror=()=>rej(new Error('imagem inválida'));im.src=fr.result;};fr.readAsDataURL(file);});}
async function addPhotos(files){for(const f of[...files].slice(0,8-FORM.photos.length)){try{const d=await shrink(f);const id=uid('ph');await DB.set('ph:'+id,d);FORM.photos.push(id);}catch(e){toast('Foto não carregou: '+e.message,'warn');}}renderPhotos();}

 const old=resOf(s);const it={id:old?.id||uid('vi'),key:stopKey(s),pid:s.pid||'',name:s.name,lat:s.lat,lon:s.lon,result:FORM.result,checks:FORM.checks,notes:(FORM.notes||'').trim(),photos:FORM.photos,pos:FORM.usePos?FORM.pos:null,at:new Date().toISOString(),by:ME||'campo',mat:MAT||'',route:VIEW.r,pkg:pk.id,novo:!!s.novo};

async function doSend(share){const all=$('sAll')?.checked;const list=Object.values(RES).filter(x=>all||!x.sent);if(!list.length){toast('Nenhuma vistoria para enviar.','warn');return;}

 if(share==='cloud'){await enviar(name,data,{vist:list.map(x=>x.key)});toast(FILA.length?'Sem conexão agora: as vistorias ficaram na fila e vão sozinhas quando houver internet.':'Vistorias entregues ao Estúdio de Rotas.',FILA.length?'warn':'ok',7000);go({v:'vist'});return;}

/* compartilha o arquivo (WhatsApp, e-mail…) ou salva em Downloads; devolve false se a pessoa cancelou */
async function shareFile(data,name,share,title,text){const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
 if(share&&navigator.canShare){try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title,text});return true;}}catch(e){if(e.name==='AbortError')return false;}}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);if(share)toast('Este celular não compartilha arquivos direto: o arquivo foi salvo em Downloads. Envie pelo WhatsApp a partir de lá.','',8000);return true;}

 if(d?.kind!=='rota-studio-campo'||!Array.isArray(d.routes)){toast('Este arquivo não é um pacote de campo do Estúdio de Rotas.','bad');return;}

function ckHtml(c){const v=DRAFT.ck[c.k]||{},bad=v.v&&!ckOk(c,v);

function ckSet(k,f,val,quiet){DRAFT.ck[k]={...(DRAFT.ck[k]||{}),[f]:val};if(quiet)return;const L=DRAFT.ckDef,i=L.findIndex(x=>x.k===k),c=L[i],el=$('ck_'+k);if(el)el.outerHTML=ckHtml(c);

 ${Object.keys(m.motivos).length?`<h3>Motivos das paradas fora do ponto</h3>${Object.entries(m.motivos).map(([k,n])=>`<div class="small">• ${esc(k)} <b>(${n})</b></div>`).join('')}`:''}
 <h3>Paradas</h3>${a.stops.map((s,i)=>`<div class="card" style="cursor:default"><span class="num" style="background:${s.inTol?'var(--ok)':s.semGps?'#64748b':'var(--bad)'}">${i+1}</span><div class="grow" style="min-width:0"><b>${s.inTol?'Nº '+esc(s.match.n)+' · '+esc(s.match.name):s.semGps?'Sem GPS':'Fora do ponto'+(s.match?' (a '+fmtM(s.match.d)+' do Nº '+esc(s.match.n)+')':'')}</b><small>⬆ ${s.emb} · ⬇ ${s.des} · a bordo ${s.bordo}${s.motivo?' · '+esc(s.motivo==='Outros'?s.motivoTxt:s.motivo):''}${s.obs?' · '+esc(s.obs):''}${s.photo?' · 📷':''}</small></div><div class="tm">${esc(s.real)}${s.prog?'<br><small>prog. '+esc(s.prog)+'</small>':''}</div></div>`).join('')||'<p class="small mut">Nenhuma parada registrada.</p>'}
 <div class="btns one" style="margin-top:12px">${CONN?`<button class="ok" onclick="acCloud(${VIEW.h})" ${a.sent?'disabled':''}>${a.sent?'☁ Entregue ao Estúdio de Rotas':a.queued?'☁ Na fila — tentar enviar de novo':'☁ Enviar direto ao Estúdio de Rotas'}</button>`:''}<button class="p" onclick="acExport(${VIEW.h},true)">📤 Exportar / Compartilhar acompanhamento</button><button onclick="acExport(${VIEW.h},false)">⬇ Salvar arquivo no celular</button><button onclick="acWhats(${VIEW.h})">💬 Enviar resumo pelo WhatsApp</button><button onclick="go({v:'home'})">Concluir</button></div>
 <p class="small mut">No computador, no Estúdio de Rotas: <b>Importar</b> e escolha o arquivo — o acompanhamento entra com 1 clique.${a.sent?' Enviado em '+new Date(a.sent).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})+'.':''}</p>`;}
/* resumo legível (WhatsApp/e-mail) */
function acText(a){const m=acMetrics(a);return [`*Acompanhamento de linha* — ${a.head.linha} ${a.head.sentido}`,`${fdt(a.head.data)} · ${a.head.hIni}–${a.head.hFim} (${durTxt(m.dur)})`,a.mode==='A'?`Modo A · carro ${a.head.carro} · motorista ${a.head.motorista} (mat. ${a.head.matMot})`:`Modo B · individual (${a.head.veic})`,`Acompanhante: ${a.head.acomp} (mat. ${a.head.matAcomp})`,'',
 `Paradas: ${m.nStops} — ${m.inT} no ponto, ${m.out} fora do ponto${m.semGps?', '+m.semGps+' sem GPS':''}`,`Pontos programados atendidos: ${m.att} de ${m.nProg}`,`Embarques ${m.emb} · Desembarques ${m.des} · Pico a bordo ${m.peak}`,m.tmN?`Pontualidade: ${m.onTime} de ${m.tmN} no horário (±5 min)${m.avg!=null?' · média '+(m.avg>0?'+':'')+Math.round(m.avg)+' min':''}`:'',m.off?`Saídas do traçado planejado: ${m.off}`:'',
 a.mode==='A'?(a.ckSkip?`Checklist dispensado: ${a.ckSkip.why}`:`Checklist: ${m.ckOkN} de ${m.ckN} conforme${m.ckBad.length?' — não conforme: '+m.ckBad.join(', '):''}`):'',...Object.entries(m.motivos).map(([k,n])=>`• Fora do ponto: ${k} (${n})`)].filter(x=>x!=='').join('\n');}
async function acData(a){const stops=[];for(const s of a.stops)stops.push({...s,photo:s.photo?(await DB.get('ph:'+s.photo))||'':''});const r=routeOf(pkgOf(a.route.pk),a.route.id);
 const data={kind:'rota-studio-acomp',v:1,app:APP,made:new Date().toISOString(),acomp:{...a,stops,nProg:r?.stops.length||a.nProg||0,prog:(r?.stops||[]).map((s,k)=>({i:k,n:s.n||k+1,name:s.name,pid:s.pid||'',lat:s.lat,lon:s.lon,t:s.t||''})),line:r?.line||'',metrics:acMetrics(a),text:acText(a)}};
 const name='Acompanhamento_'+String(a.head.linha).replace(/[^\wÀ-ú]+/g,'_')+'_'+a.head.sentido+'_'+a.head.data+'_'+a.head.hIni.replace(':','h')+'.json';
 return{data,name};}
async function acExport(i,share){const a=HIST[i];if(!a)return;const{data,name}=await acData(a);
 if(!await shareFile(data,name,share,'Acompanhamento '+a.head.linha+' '+a.head.sentido,acText(a)))return;a.sent=new Date().toISOString();await saveAll();toast('Acompanhamento pronto para o computador.','ok');render();}
function acWhats(i){const a=HIST[i];if(a)window.open('https://wa.me/?text='+encodeURIComponent(acText(a)),'_blank');}
async function boot(){await DB.open();PKGS=(await DB.get('pkgs'))||[];RES=(await DB.get('res'))||{};ME=(await DB.get('me'))||'';MAT=(await DB.get('mat'))||'';AC=(await DB.get('ac'))||null;HIST=(await DB.get('hist'))||[];CONN=(await DB.get('conn'))||null;FILA=(await DB.get('fila'))||[];initMap();
 $('btnBack').onclick=()=>{FORM=null;const v=VIEW.v;if(v==='form')go({...VIEW,v:'point'});else if(v==='point'&&VIEW.r!=='§novos')go({v:'route',pk:VIEW.pk,r:VIEW.r});else if(v==='route'||v==='send')go({v:'vist'});else if(v==='acStop'){STOP=null;go({v:'acRun'});}else if(v==='acHead')go({v:'acNew'});else go({v:'home'});};
 $('btnLayer').onclick=toggleTiles;$('btnGps').onclick=()=>gpsToggle();$('file').onchange=e=>{openFile(e.target.files[0]);e.target.value='';};
 window.addEventListener('beforeunload',e=>{if((pendingExport()||AC)&&DB.mode==='mem'){e.preventDefault();e.returnValue='';}});
 if(AC&&AC.status==='run'){go({v:'acRun'});toast('Acompanhamento em andamento retomado.','ok');}else render();if(CONN)campoSync(false);}
/* ---------- conexão com o Estúdio de Rotas (Apps Script do link): a base chega sozinha e os resultados vão direto ---------- */
const connUrl=q=>CONN.url+(CONN.url.includes('?')?'&':'?')+q;
function campoConnect(){const c=prompt('Cole o código de conexão (computador: Estúdio de Rotas → Acompanhamentos → Sincronização com o celular → Copiar).\nDeixe em branco para desconectar.','');if(c===null)return;
 if(!c.trim()){CONN=null;saveAll();render();toast('Celular desconectado do Estúdio de Rotas.','ok');return;}
 let t=c.trim();if(/^RSC2-/.test(t)){try{const b=t.slice(5).replace(/\s+/g,'');t='RSC1|'+atob(b+'='.repeat((4-b.length%4)%4));}catch{t='';}}
 const m=/^RSC1\|(https:\/\/script\.google(?:usercontent)?\.com\/[^|\s]+)\|([0-9a-f]{16,64})$/i.exec(t);if(!m){toast('Código inválido: copie de novo no Estúdio de Rotas (Acompanhamentos → 📋 Copiar) e cole aqui, sem abrir como link.','bad',8000);return;}
 CONN={url:m[1],key:m[2],at:''};saveAll();campoSync(true);}
async function campoSync(manual){if(!CONN)return;if(!navigator.onLine){if(manual)toast('Sem internet agora: a base fica como está e os envios esperam na fila.','warn');return;}
 try{const r=await fetch(connUrl('campo=pacote&t='+encodeURIComponent(CONN.key)));const d=await r.json();if(d.ok===false)throw new Error(d.erro||'erro do Estúdio de Rotas');if(d.kind!=='rota-studio-campo'||!Array.isArray(d.routes))throw new Error('resposta inesperada');
  await loadPkg({...d,auto:true});CONN.at=new Date().toISOString();await saveAll();if(manual)toast('Base atualizada: '+d.routes.length+' viagem(ns) vigente(s).','ok');if(['home','vist'].includes(VIEW.v))render();}
 catch(e){if(manual)toast('Não consegui buscar a base: '+e.message,'bad',8000);}await flush();}
async function enviar(nome,dados,ref){FILA.push({nome,dados,ref:ref||null,at:new Date().toISOString()});await saveAll();return flush();}
let FLUSHING=false;
async function flush(){if(!CONN||!FILA.length||FLUSHING||!navigator.onLine)return !FILA.length;FLUSHING=true;let ok=0;
 try{while(FILA.length){const it=FILA[0];const r=await fetch(CONN.url,{method:'POST',body:JSON.stringify({t:CONN.key,nome:it.nome,dados:it.dados})});const d=await r.json().catch(()=>({ok:false,erro:'resposta inválida'}));if(!d.ok)throw new Error(d.erro||'falhou');
  FILA.shift();ok++;const now=new Date().toISOString();if(it.ref?.ac){const h=HIST.find(x=>x.id===it.ref.ac);if(h)h.sent=now;}for(const k of it.ref?.vist||[])if(RES[k])RES[k].sent=now;await saveAll();}}
 catch(e){toast('Envio ao Estúdio de Rotas pendente ('+e.message+'). Tento de novo quando houver internet.','warn',7000);}finally{FLUSHING=false;}
 if(ok){toast(ok+' envio(s) entregue(s) ao Estúdio de Rotas.','ok');if(['home','acEnd','vist'].includes(VIEW.v))render();}return !FILA.length;}
window.addEventListener('online',()=>flush());
document.addEventListener('DOMContentLoaded',boot);
</script>
</body></html>
